<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Parallax">
  <title>Parallax</title>
  <desc>Dois pontos de observação medindo o mesmo alvo: o ângulo entre as visadas é a paralaxe.</desc>
  <defs>
    <linearGradient id="px-alvo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- visada A: o histórico do canal -->
  <path d="M20 94 L60 32" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linecap="round"/>
  <!-- visada B: o conteúdo do criativo -->
  <path d="M100 94 L60 32" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- o ângulo entre as duas visadas: o que de fato se mede -->
  <path d="M43 62 Q60 72 77 62" fill="none" stroke="#38BDF8" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 6"/>

  <!-- a base conhecida entre os dois pontos de vista -->
  <path d="M20 94 L100 94" fill="none" stroke="#4F46E5" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 7" opacity=".55"/>

  <!-- o alvo: o criativo cujo alcance se estima -->
  <circle cx="60" cy="32" r="18" fill="none" stroke="#A5B4FC" stroke-width="2" opacity=".45"/>
  <circle cx="60" cy="32" r="10" fill="url(#px-alvo)"/>

  <!-- os dois pontos de observação -->
  <circle cx="20" cy="94" r="7.5" fill="#4F46E5"/>
  <circle cx="100" cy="94" r="7.5" fill="#38BDF8"/>
</svg>
